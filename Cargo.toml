[package]
name = "zenjpeg"
version = "0.1.0"
edition = "2021"
rust-version = "1.70.0"
license = "BSD-3-Clause"
description = "High-quality JPEG encoder combining mozjpeg and jpegli approaches for Pareto-optimal compression"
keywords = ["jpeg", "encoder", "compression", "image", "perceptual"]
categories = ["encoding", "multimedia::images"]

[features]
default = []
simd = []  # Enable SIMD intrinsics
ffi-tests = ["jpegli-internals-sys"]  # Enable C++ FFI comparison tests
gpu = ["ssimulacra2-cuda", "dssim-cuda", "butteraugli-cuda", "cudarse-driver", "cudarse-npp"]  # GPU-accelerated metrics (requires CUDA)

[dependencies]
# Core utilities
bytemuck = { version = "1.14", features = ["derive"] }
wide = "0.7"
multiversion = "0.7"  # For SIMD autovectorization across platforms

# Image analysis for auto-picking encoding strategy
evalchroma = "1.0"
imgref = "1.10"
rgb = "0.8"

# Reference implementations (for comparison and fallback)
mozjpeg-oxide = { path = "../mozjpeg-rs", package = "mozjpeg-rs" }
# jpegli-rs main branch - note: aq-tuning branch only adds benchmarking, not AQ algorithm changes
jpegli = { path = "../jpegli-rs/jpegli-rs", package = "jpegli-rs" }

# FFI bindings to C++ jpegli (optional, for verification tests)
jpegli-internals-sys = { path = "../jpegli-rs/internal/jpegli-internals-sys", optional = true }

# GPU-accelerated metrics (optional, requires CUDA installation)
ssimulacra2-cuda = { path = "../turbo-metrics/crates/ssimulacra2-cuda", optional = true }
dssim-cuda = { path = "../turbo-metrics/crates/dssim-cuda", optional = true }
butteraugli-cuda = { path = "../turbo-metrics/crates/butteraugli-cuda", optional = true }
cudarse-driver = { path = "../turbo-metrics/crates/cudarse/cudarse-driver", optional = true }
cudarse-npp = { path = "../turbo-metrics/crates/cudarse/cudarse-npp", features = ["isu", "ist"], optional = true }

[dev-dependencies]
# Image I/O
png = "0.17"
jpeg-decoder = "0.3"

# Quality metrics (individual metrics for standalone tests)
dssim = "3.2"
butteraugli = { path = "../butteraugli/butteraugli" }
# fast-ssim2 is faster SIMD-accelerated ssimulacra2 with batch comparison support
fast-ssim2 = { version = "0.6", features = ["imgref"] }

# Codec evaluation (handles metrics, ICC profiles, and JPEG decoding)
codec-eval = { path = "../codec-eval" }

# Testing
proptest = "1.4"
criterion = "0.5"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

# C mozjpeg for comparison
mozjpeg-sys = "2.0"
mozjpeg = "0.10"

# Sharp YUV chroma subsampling
yuv = "0.8"

# CLI and hashing for benchmark infrastructure
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.8"

# GPU-accelerated SSIM2: Use --features gpu (requires CUDA_PATH to be set)
# Example: CUDA_PATH=/usr/local/cuda-12.6 cargo run --release --features gpu --example discover_heuristics -- ...

# Profile for building nvptx (CUDA kernel) code - uncomment if using CUDA
# [profile.release-nvptx]
# inherits = "release"
# opt-level = 3
# lto = "fat"
# codegen-units = 1
# overflow-checks = false

# Benchmarks (uncomment when benches/ directory is created)
# [[bench]]
# name = "encode"
# harness = false
#
# [[bench]]
# name = "pareto"
# harness = false
